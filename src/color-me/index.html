<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd8ec" />
    <title>Color Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+2:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #2b2350;
        --pink: #ff5fa2;
        --card: #ffffff;
        --shadow: rgba(43, 35, 80, 0.22);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: "Fredoka", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 20%, #ffe066 0 7px, transparent 8px),
          radial-gradient(circle at 90% 15%, #ff8fb1 0 6px, transparent 7px),
          radial-gradient(circle at 15% 85%, #8fd6ff 0 9px, transparent 10px),
          radial-gradient(circle at 88% 80%, #b8f0a1 0 7px, transparent 8px),
          linear-gradient(135deg, #fff2c7 0%, #ffd8ec 45%, #c7ecff 100%);
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ---------- Header ---------- */
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(env(safe-area-inset-top) + 8px) 14px 4px;
      }

      .brand {
        font-family: "Baloo 2", "Fredoka", sans-serif;
        font-weight: 800;
        font-size: clamp(1.5rem, 4.5vw, 2.2rem);
        line-height: 1;
        color: #fff;
        text-shadow:
          0 3px 0 var(--pink),
          0 6px 10px rgba(43, 35, 80, 0.25);
        transform: rotate(-2deg);
        white-space: nowrap;
      }

      .brand span {
        display: inline-block;
      }
      .brand span:nth-child(1) { color: #ff6b6b; }
      .brand span:nth-child(2) { color: #ffa94d; }
      .brand span:nth-child(3) { color: #ffd43b; }
      .brand span:nth-child(4) { color: #69db7c; }
      .brand span:nth-child(5) { color: #4dabf7; }
      .brand span:nth-child(6) { color: #b197fc; margin-left: 0.3em; }
      .brand span:nth-child(7) { color: #ff5fa2; }

      .pic-name {
        flex: 1;
        text-align: center;
        font-weight: 700;
        font-size: clamp(1rem, 3vw, 1.3rem);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pic-name b {
        background: rgba(255, 255, 255, 0.75);
        padding: 4px 16px;
        border-radius: 999px;
      }

      .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: var(--ink);
        font-family: "Baloo 2", "Fredoka", sans-serif;
        font-weight: 800;
        font-size: 1rem;
        padding: 8px 16px;
        border-radius: 999px;
        border: 3px solid #fff;
        background: linear-gradient(180deg, #ffe58f, #ffb256);
        box-shadow:
          0 4px 0 #c6761f,
          0 8px 14px var(--shadow);
        transition: transform 0.15s ease;
        white-space: nowrap;
      }

      .home-btn:hover {
        transform: translateY(-2px);
      }
      .home-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #c6761f, 0 4px 8px var(--shadow);
      }

      /* ---------- Palette ---------- */
      .palette {
        display: grid;
        grid-template-columns: repeat(24, 1fr);
        gap: 6px;
        margin: 8px auto 4px;
        padding: 8px 10px;
        width: min(100% - 20px, 1000px);
        background: rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        box-shadow: 0 4px 0 rgba(43, 35, 80, 0.1), 0 10px 20px -8px var(--shadow);
      }

      .swatch {
        aspect-ratio: 1;
        width: 100%;
        max-width: 40px;
        justify-self: center;
        border-radius: 50%;
        border: 3px solid rgba(43, 35, 80, 0.25);
        background: var(--c);
        cursor: pointer;
        padding: 0;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .swatch:hover {
        transform: scale(1.12);
      }

      .swatch.selected {
        transform: scale(1.22);
        border-color: #fff;
        box-shadow:
          0 0 0 3px var(--ink),
          0 4px 10px var(--shadow);
      }

      /* ---------- Toolbar ---------- */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 2px;
      }

      .current {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 3px 0 rgba(43, 35, 80, 0.15);
      }

      .current svg {
        width: 34px;
        height: 34px;
      }

      .btn {
        font-family: "Fredoka", system-ui, sans-serif;
        font-weight: 700;
        font-size: 0.98rem;
        color: var(--ink);
        border: 3px solid #fff;
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
        background: var(--bg, #fff);
        box-shadow: 0 4px 0 var(--edge, #c9c3e0), 0 6px 12px -4px var(--shadow);
        transition: transform 0.12s ease;
        white-space: nowrap;
      }

      .btn:hover {
        transform: translateY(-2px);
      }
      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--edge, #c9c3e0);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }

      .btn.new { --bg: linear-gradient(180deg, #ffb3d2, #ff7eb3); --edge: #c2457b; }
      .btn.pick { --bg: linear-gradient(180deg, #c7e9ff, #8ed1ff); --edge: #3f8fbf; }
      .btn.undo { --bg: linear-gradient(180deg, #fff6a6, #ffd93d); --edge: #c58f11; }
      .btn.clear { --bg: linear-gradient(180deg, #d6f5cf, #a8e29c); --edge: #5a9e4c; }
      .btn.save { --bg: linear-gradient(180deg, #e6d6ff, #c4a6ff); --edge: #7d5bc0; }
      .btn.sound { padding: 7px 11px; }

      /* ---------- Board ---------- */
      .board-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 12px calc(env(safe-area-inset-bottom) + 12px);
        position: relative;
      }

      #board {
        background: #fff;
        border-radius: 22px;
        border: 5px solid #fff;
        box-shadow:
          0 8px 0 rgba(43, 35, 80, 0.12),
          0 20px 36px -12px rgba(43, 35, 80, 0.35);
        touch-action: manipulation;
        display: block;
      }

      .loading {
        position: absolute;
        font-weight: 700;
        opacity: 0.6;
        pointer-events: none;
      }

      /* ---------- Sparkles / confetti ---------- */
      .spark {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 50;
        border: 2px solid #fff;
        animation: spark 0.6s ease-out forwards;
      }

      @keyframes spark {
        from {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        to {
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
          opacity: 0;
        }
      }

      .confetti {
        position: fixed;
        top: -20px;
        width: 10px;
        height: 16px;
        border-radius: 3px;
        pointer-events: none;
        z-index: 60;
        animation: fall var(--t, 2.6s) linear forwards;
      }

      @keyframes fall {
        to {
          transform: translate(var(--drift), 110vh) rotate(var(--spin));
        }
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%) scale(0.6);
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: clamp(2rem, 8vw, 3.6rem);
        color: #fff;
        text-shadow: 0 4px 0 var(--pink), 0 10px 20px rgba(43, 35, 80, 0.35);
        pointer-events: none;
        opacity: 0;
        z-index: 70;
        white-space: nowrap;
      }

      .toast.show {
        animation: pop 2.2s ease forwards;
      }

      @keyframes pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6) rotate(-6deg); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(2deg); }
        25% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
        80% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
      }

      /* ---------- Gallery ---------- */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(43, 35, 80, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 16px;
      }

      .modal.open {
        display: flex;
      }

      .sheet {
        background: #fff;
        border-radius: 24px;
        width: min(100%, 900px);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        background: linear-gradient(90deg, #ffe7a8, #ffd1e3, #c7e9ff);
      }

      .close-btn {
        border: none;
        background: #fff;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 1.3rem;
        cursor: pointer;
        box-shadow: 0 3px 0 rgba(43, 35, 80, 0.15);
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 12px;
        padding: 16px;
        overflow-y: auto;
      }

      .thumb {
        border: 3px solid #eee;
        border-radius: 16px;
        background: #fff;
        padding: 6px 6px 4px;
        cursor: pointer;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--ink);
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .thumb:hover {
        transform: translateY(-3px) rotate(-1deg);
        border-color: var(--pink);
      }

      .thumb.current-pic {
        border-color: #4ec5ff;
      }

      .thumb svg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* ---------- Small screens ---------- */
      @media (max-width: 760px) {
        .palette {
          grid-template-columns: repeat(12, 1fr);
          gap: 6px 4px;
        }
        .pic-name {
          display: none;
        }
        .top {
          justify-content: space-between;
        }
        .btn .label {
          display: none;
        }
        .btn {
          font-size: 1.2rem;
          padding: 6px 12px;
        }
        .home-btn {
          padding: 6px 12px;
        }
      }

      @media (max-width: 420px) {
        .palette {
          grid-template-columns: repeat(8, 1fr);
        }
        .toolbar {
          gap: 5px;
        }
        .btn {
          font-size: 1.05rem;
          padding: 5px 9px;
        }
        .current {
          width: 38px;
          height: 38px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand" aria-label="Color Me">
        <span>C</span><span>o</span><span>l</span><span>o</span><span>r</span><span>M</span><span>e</span>
      </div>
      <div class="pic-name"><b id="picName">…</b></div>
      <a class="home-btn" href="https://sodigames.com" aria-label="Back to home page">🏠 Home</a>
    </header>

    <div class="toolbar">
      <div class="current" id="current" title="Your paint color"></div>
      <button class="btn new" id="newBtn" type="button">🎲<span class="label"> New Picture</span></button>
      <button class="btn pick" id="pickBtn" type="button">🖼️<span class="label"> Pick</span></button>
      <button class="btn undo" id="undoBtn" type="button" disabled>↩️<span class="label"> Undo</span></button>
      <button class="btn clear" id="clearBtn" type="button">🧽<span class="label"> Start Over</span></button>
      <button class="btn save" id="saveBtn" type="button">💾<span class="label"> Save</span></button>
      <button class="btn sound" id="soundBtn" type="button" aria-label="Toggle sound">🔊</button>
    </div>

    <div class="palette" id="palette" role="radiogroup" aria-label="Colors"></div>

    <main class="board-wrap" id="wrap">
      <canvas id="board" width="900" height="900" aria-label="Coloring picture"></canvas>
      <div class="loading" id="loading">Loading…</div>
    </main>

    <div class="modal" id="gallery" aria-hidden="true">
      <div class="sheet" role="dialog" aria-label="Pick a picture">
        <div class="sheet-head">
          <span>Pick a picture 🖍️</span>
          <button class="close-btn" id="closeGallery" type="button" aria-label="Close">✖</button>
        </div>
        <div class="gallery" id="galleryGrid"></div>
      </div>
    </div>

    <div class="toast" id="toast">Beautiful! 🌟</div>

    <script>
      (() => {
        "use strict";

        /* =========================================================
         * Drawing helpers — every picture is a 200x200 SVG made of
         * closed shapes with thick black outlines and white fills.
         * ========================================================= */
        const n = (v) => +v.toFixed(2);
        let uid = 0;

        const dot = (x, y, r = 5) =>
          `<circle cx="${x}" cy="${y}" r="${r}" fill="#000"/>` +
          `<circle cx="${n(x + r * 0.38)}" cy="${n(y - r * 0.38)}" r="${n(r * 0.34)}" fill="#fff" stroke="none"/>`;
        const eyes = (x1, x2, y, r = 5) => dot(x1, y, r) + dot(x2, y, r);
        const smile = (x, y, w = 7, d = 4, sw = 3.5) =>
          `<path d="M${n(x - w)} ${y} Q${x} ${n(y + d * 2)} ${n(x + w)} ${y}" fill="none" stroke-width="${sw}"/>`;
        const cheek = (x, y, rx = 6, ry = 3.5) =>
          `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" stroke-width="2.5"/>`;
        const cheeks = (x1, x2, y, rx, ry) => cheek(x1, y, rx, ry) + cheek(x2, y, rx, ry);
        const face = (cx, cy, s = 1, withCheeks = true) =>
          eyes(n(cx - 12 * s), n(cx + 12 * s), cy, n(5 * s)) +
          smile(cx, n(cy + 9 * s), n(7 * s), n(4 * s), n(Math.max(2.5, 3.5 * Math.min(1, s)))) +
          (withCheeks ? cheeks(n(cx - 20 * s), n(cx + 20 * s), n(cy + 8 * s), n(6 * s), n(3.5 * s)) : "");

        const star = (cx, cy, R, r, attrs = "") => {
          const pts = [];
          for (let i = 0; i < 10; i++) {
            const a = ((-90 + i * 36) * Math.PI) / 180;
            const rad = i % 2 ? r : R;
            pts.push(`${n(cx + rad * Math.cos(a))},${n(cy + rad * Math.sin(a))}`);
          }
          return `<polygon points="${pts.join(" ")}" ${attrs}/>`;
        };

        const cloud = (cx, cy, s = 1) =>
          `<path d="M-30 12 A12 12 0 0 1 -26 -10 A16 16 0 0 1 2 -18 A14 14 0 0 1 26 -6 A11 11 0 0 1 30 12 Z" ` +
          `transform="translate(${cx} ${cy}) scale(${s})" stroke-width="${n(4 / s)}"/>`;

        const rays = (cx, cy, r, R, count = 12, half = 12) => {
          let out = "";
          for (let i = 0; i < count; i++) {
            const a = (i * 360) / count;
            const p = (deg, rad) => {
              const t = (deg * Math.PI) / 180;
              return `${n(cx + rad * Math.cos(t))},${n(cy + rad * Math.sin(t))}`;
            };
            out += `<polygon points="${p(a - half, r)} ${p(a, R)} ${p(a + half, r)}"/>`;
          }
          return out;
        };

        const heart = (cx, cy, s) =>
          `<path d="M${cx} ${n(cy + s * 0.9)} C${n(cx - s * 1.6)} ${n(cy - s * 0.2)} ${n(cx - s * 0.8)} ${n(cy - s * 1.3)} ${cx} ${n(cy - s * 0.4)} ` +
          `C${n(cx + s * 0.8)} ${n(cy - s * 1.3)} ${n(cx + s * 1.6)} ${n(cy - s * 0.2)} ${cx} ${n(cy + s * 0.9)}Z"/>`;

        const spiral = (cx, cy, R, turns = 2.3) => {
          let d = "";
          for (let t = 0.06; t <= 1.0001; t += 0.01) {
            const a = turns * 2 * Math.PI * t;
            d += (d ? " L" : "M") + `${n(cx + R * t * Math.cos(a))} ${n(cy + R * t * Math.sin(a))}`;
          }
          return `<path d="${d}" fill="none"/>`;
        };

        const tinyFlower = (x, y) =>
          [0, 72, 144, 216, 288]
            .map((a) => {
              const t = ((a - 90) * Math.PI) / 180;
              return `<circle cx="${n(x + 6 * Math.cos(t))}" cy="${n(y + 6 * Math.sin(t))}" r="4.5" stroke-width="2.5"/>`;
            })
            .join("") + `<circle cx="${x}" cy="${y}" r="3.5" stroke-width="2.5"/>`;

        const wavyCircle = (cx, cy, r, amp, waves) => {
          let d = "";
          for (let i = 0; i <= 120; i++) {
            const t = (i / 120) * Math.PI * 2;
            const rr = r + amp * Math.sin(t * waves);
            d += (i ? " L" : "M") + `${n(cx + rr * Math.cos(t))} ${n(cy + rr * Math.sin(t))}`;
          }
          return `<path d="${d}Z"/>`;
        };

        /* Cake frosting: rounded top edge with drippy scallops underneath. */
        const frosting = (x0, x1, y, scallops) => {
          const w = (x1 - x0) / scallops;
          let d = `M${x0} ${y + 12} V${y + 8} Q${x0} ${y} ${x0 + 8} ${y} H${x1 - 8} Q${x1} ${y} ${x1} ${y + 8} V${y + 12}`;
          for (let k = 0; k < scallops; k++) {
            const xa = x1 - k * w;
            d += ` Q${n(xa - w / 2)} ${y + 24} ${n(xa - w)} ${y + 12}`;
          }
          return `<path d="${d}Z"/>`;
        };

        /* A shape with extra dividing lines that are clipped to its inside. */
        const pat = (shape, inner) => {
          const id = "cm" + uid++;
          return (
            `<clipPath id="${id}">${shape}</clipPath>${shape}` +
            `<g clip-path="url(#${id})">${inner}</g>${shape.replace("/>", ' fill="none"/>')}`
          );
        };

        const diamonds = (x0, y0, x1, y1, step, rise) => {
          let d = "";
          for (let x = x0 - (y1 - y0); x <= x1 + (y1 - y0); x += step) {
            d += `M${x} ${y0} L${x + rise} ${y1} M${x} ${y0} L${x - rise} ${y1} `;
          }
          return `<path d="${d}" fill="none" stroke-width="3"/>`;
        };

        /* =========================================================
         * Pictures
         * ========================================================= */
        const PICTURES = [
          {
            name: "Flower",
            body: `
              <path d="M0 188 H200" fill="none"/>
              <path d="M100 165 C82 146 60 150 50 162 C64 176 86 176 100 165Z"/>
              <path d="M100 145 C118 126 140 130 150 142 C136 156 114 156 100 145Z"/>
              <rect x="94" y="100" width="12" height="90" rx="6"/>
              ${[0, 45, 90, 135, 180, 225, 270, 315]
                .map((a) => `<ellipse cx="100" cy="46" rx="15" ry="25" transform="rotate(${a} 100 78)"/>`)
                .join("")}
              <circle cx="100" cy="78" r="24"/>
              ${face(100, 76, 0.8)}
              ${tinyFlower(30, 176)}${tinyFlower(172, 174)}`,
          },
          {
            name: "Carrot",
            body: `
              <path d="M100 66 C88 44 70 30 64 16 C84 18 98 36 106 62Z"/>
              <path d="M98 66 C94 40 96 22 106 6 C116 22 114 44 108 66Z"/>
              <path d="M104 66 C114 44 128 32 142 24 C142 42 126 58 110 68Z"/>
              <path d="M64 72 Q100 54 136 72 Q130 132 100 194 Q70 132 64 72Z"/>
              <path d="M80 124 H92 M110 142 H122 M90 166 H100" fill="none"/>
              ${face(100, 94, 0.9)}`,
          },
          {
            name: "Bunny",
            body: `
              <ellipse cx="80" cy="48" rx="14" ry="38" transform="rotate(-10 80 48)"/>
              <ellipse cx="80" cy="52" rx="6" ry="25" transform="rotate(-10 80 48)" stroke-width="3"/>
              <ellipse cx="120" cy="48" rx="14" ry="38" transform="rotate(10 120 48)"/>
              <ellipse cx="120" cy="52" rx="6" ry="25" transform="rotate(10 120 48)" stroke-width="3"/>
              <circle cx="146" cy="166" r="11"/>
              <ellipse cx="100" cy="160" rx="44" ry="34"/>
              <ellipse cx="100" cy="170" rx="24" ry="17" stroke-width="3"/>
              <circle cx="100" cy="104" r="38"/>
              <ellipse cx="76" cy="190" rx="17" ry="8"/>
              <ellipse cx="124" cy="190" rx="17" ry="8"/>
              ${eyes(86, 114, 100, 5)}
              <path d="M95 110 H105 L100 116Z"/>
              <path d="M100 116 Q96 124 90 120 M100 116 Q104 124 110 120" fill="none" stroke-width="3"/>
              ${cheeks(76, 124, 114, 7, 4)}`,
          },
          {
            name: "Rainbow",
            body: `
              <path d="M0 186 Q50 176 100 186 T200 186" fill="none"/>
              ${[86, 73, 60, 47, 34]
                .map((r) => `<path d="M${100 - r} 150 A${r} ${r} 0 0 1 ${100 + r} 150Z"/>`)
                .join("")}
              ${cloud(28, 150, 0.85)}${cloud(172, 150, 0.85)}
              ${face(28, 152, 0.45)}${face(172, 152, 0.45)}
              ${rays(168, 32, 18, 28, 10, 11)}<circle cx="168" cy="32" r="16"/>
              ${star(30, 34, 11, 5)}${star(56, 16, 7, 3)}`,
          },
          {

        /* =========================================================
         * Palette — 24 colors around the rainbow, plus neutrals.
         * ========================================================= */
        const COLORS = [
          ["#e53935", "Red"],
          ["#ff5722", "Red orange"],
          ["#ff9800", "Orange"],
          ["#ffc107", "Gold"],
          ["#ffeb3b", "Yellow"],
          ["#d4e157", "Lime"],
          ["#8bc34a", "Light green"],
          ["#43a047", "Green"],
          ["#a5d6a7", "Mint"],
          ["#00897b", "Teal"],
          ["#26c6da", "Aqua"],
          ["#81d4fa", "Sky blue"],
          ["#1e88e5", "Blue"],
          ["#3949ab", "Indigo"],
          ["#7e57c2", "Violet"],
          ["#ce93d8", "Lavender"],
          ["#ab47bc", "Purple"],
          ["#ec407a", "Pink"],
          ["#f8bbd0", "Light pink"],
          ["#ffccbc", "Peach"],
          ["#8d6e63", "Brown"],
          ["#ffffff", "White"],
          ["#9e9e9e", "Gray"],
          ["#37474f", "Charcoal"],
        ];

        /* =========================================================
         * State
         * ========================================================= */
        const SIZE = 900;
        const board = document.getElementById("board");
        const ctx = board.getContext("2d");
        const lineCanvas = document.createElement("canvas");
        const colorCanvas = document.createElement("canvas");
        lineCanvas.width = lineCanvas.height = colorCanvas.width = colorCanvas.height = SIZE;
        const lineCtx = lineCanvas.getContext("2d", { willReadFrequently: true });
        const colorCtx = colorCanvas.getContext("2d");
        const colorImg = colorCtx.createImageData(SIZE, SIZE);

        let picIndex = -1;
        let labels = null; // Int32Array: region id per pixel (0 = outline)
        let regionSizes = [];
        let fills = {}; // region id -> hex color
        let history = [];
        let celebrated = false;
        let currentColor = COLORS[17][0];
        let currentColorIndex = 17;
        let loadToken = 0;
        let anim = null;
        let muted = false;
        const savedArt = {}; // picture index -> { fills, history, celebrated }

        try {
          muted = localStorage.getItem("colorMeMuted") === "1";
        } catch (e) {}

        /* =========================================================
         * SVG rendering
         * ========================================================= */
        const svgMarkup = (pic, size) =>
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="${size}" height="${size}">` +
          `<rect width="200" height="200" fill="#fff"/>` +
          `<g fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${pic.body}</g></svg>`;

        function loadPicture(index) {
          stashArt();
          finishAnim();
          picIndex = index;
          const pic = PICTURES[index];
          document.getElementById("picName").textContent = pic.name;
          document.getElementById("loading").style.display = "";
          const token = ++loadToken;
          const img = new Image();
          img.onload = () => {
            if (token !== loadToken) return;
            lineCtx.fillStyle = "#fff";
            lineCtx.fillRect(0, 0, SIZE, SIZE);
            lineCtx.drawImage(img, 0, 0, SIZE, SIZE);
            let data;
            try {
              data = lineCtx.getImageData(0, 0, SIZE, SIZE);
            } catch (e) {
              document.getElementById("loading").textContent = "Oops! This browser can't load the picture.";
              return;
            }
            computeRegions(data.data);
            const saved = savedArt[index];
            fills = saved ? { ...saved.fills } : {};
            history = saved ? saved.history.slice() : [];
            celebrated = saved ? saved.celebrated : false;
            repaintAll();
            updateButtons();
            document.getElementById("loading").style.display = "none";
          };
          img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgMarkup(pic, SIZE));
        }

        function stashArt() {
          if (picIndex < 0 || !labels) return;
          savedArt[picIndex] = { fills: { ...fills }, history: history.slice(), celebrated };
        }

        /* Label every enclosed white area so a click can fill it later. */
        function computeRegions(px) {
          const N = SIZE * SIZE;
          const light = new Uint8Array(N);
          for (let i = 0; i < N; i++) light[i] = px[i * 4] > 170 ? 1 : 0;

          const lab = new Int32Array(N);
          const stack = new Int32Array(N);
          const sizes = [0];
          let next = 1;
          for (let s = 0; s < N; s++) {
            if (!light[s] || lab[s]) continue;
            let sp = 0;
            let count = 0;
            stack[sp++] = s;
            lab[s] = next;
            while (sp) {
              const p = stack[--sp];
              count++;
              const x = p % SIZE;
              if (x > 0 && light[p - 1] && !lab[p - 1]) { lab[p - 1] = next; stack[sp++] = p - 1; }
              if (x < SIZE - 1 && light[p + 1] && !lab[p + 1]) { lab[p + 1] = next; stack[sp++] = p + 1; }
              if (p >= SIZE && light[p - SIZE] && !lab[p - SIZE]) { lab[p - SIZE] = next; stack[sp++] = p - SIZE; }
              if (p < N - SIZE && light[p + SIZE] && !lab[p + SIZE]) { lab[p + SIZE] = next; stack[sp++] = p + SIZE; }
            }
            sizes.push(count);
            next++;
          }

          // Grow each region a few pixels under the outlines so the
          // anti-aliased edges get colored too (no white halos).
          for (let pass = 0; pass < 3; pass++) {
            const src = lab.slice();
            for (let p = 0; p < N; p++) {
              if (src[p]) continue;
              const x = p % SIZE;
              let v = 0;
              if (x > 0 && src[p - 1]) v = src[p - 1];
              else if (x < SIZE - 1 && src[p + 1]) v = src[p + 1];
              else if (p >= SIZE && src[p - SIZE]) v = src[p - SIZE];
              else if (p < N - SIZE && src[p + SIZE]) v = src[p + SIZE];
              if (v) lab[p] = v;
            }
          }
          labels = lab;
          regionSizes = sizes;
        }

        /* =========================================================
         * Painting
         * ========================================================= */
        const hexToRgb = (hex) => {
          const v = parseInt(hex.slice(1), 16);
          return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
        };

        function composite() {
          colorCtx.putImageData(colorImg, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          ctx.drawImage(colorCanvas, 0, 0);
          ctx.globalCompositeOperation = "multiply";
          ctx.drawImage(lineCanvas, 0, 0);
          ctx.globalCompositeOperation = "source-over";
        }

        function repaintAll() {
          const d = colorImg.data;
          const rgb = {};
          for (const k in fills) rgb[k] = hexToRgb(fills[k]);
          for (let p = 0, i = 0; p < labels.length; p++, i += 4) {
            const c = rgb[labels[p]];
            if (c) {
              d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
            } else {
              d[i] = d[i + 1] = d[i + 2] = 255;
            }
            d[i + 3] = 255;
          }
          composite();
        }

        function finishAnim() {
          if (!anim) return;
          anim.step(Infinity);
          anim = null;
          composite();
        }

        /* Fill one region with a "ripple" that spreads from the click point. */
        function fillRegion(region, color, ox, oy) {
          finishAnim();
          const prev = fills[region] || null;
          if (prev === color) return false;
          history.push({ region, prev });
          if (color) fills[region] = color;
          else delete fills[region];

          const [r, g, b] = color ? hexToRgb(color) : [255, 255, 255];
          const pixels = [];
          for (let p = 0; p < labels.length; p++) if (labels[p] === region) pixels.push(p);

          // Bucket the pixels by distance from the click (counting sort).
          let maxD = 0;
          const dist = new Uint16Array(pixels.length);
          for (let j = 0; j < pixels.length; j++) {
            const p = pixels[j];
            const dx = (p % SIZE) - ox;
            const dy = ((p / SIZE) | 0) - oy;
            const dd = Math.sqrt(dx * dx + dy * dy) | 0;
            dist[j] = dd;
            if (dd > maxD) maxD = dd;
          }
          const counts = new Uint32Array(maxD + 2);
          for (let j = 0; j < dist.length; j++) counts[dist[j] + 1]++;
          for (let k = 1; k < counts.length; k++) counts[k] += counts[k - 1];
          const order = new Int32Array(pixels.length);
          const cursor = counts.slice();
          for (let j = 0; j < dist.length; j++) order[cursor[dist[j]]++] = pixels[j];

          const d = colorImg.data;
          let done = 0;
          const step = (radius) => {
            const end = radius >= maxD ? order.length : counts[Math.min(maxD + 1, (radius | 0) + 1)];
            for (; done < end; done++) {
              const i = order[done] * 4;
              d[i] = r; d[i + 1] = g; d[i + 2] = b;
            }
          };

          const duration = Math.min(420, 140 + maxD * 0.5);
          const start = performance.now();
          const current = { step };
          anim = current;
          const tick = (now) => {
            if (anim !== current) return;
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 2);
            step(t >= 1 ? Infinity : eased * maxD);
            composite();
            if (t < 1) requestAnimationFrame(tick);
            else anim = null;
          };
          requestAnimationFrame(tick);
          return true;
        }

        function regionAt(x, y) {
          const at = (px, py) =>
            px >= 0 && py >= 0 && px < SIZE && py < SIZE ? labels[py * SIZE + px] : 0;
          const direct = at(x, y);
          if (direct) return direct;
          // Tapped on an outline: find the closest colorable spot nearby.
          for (let rad = 1; rad <= 14; rad++) {
            for (let a = 0; a < 16; a++) {
              const t = (a / 16) * Math.PI * 2;
              const v = at(Math.round(x + rad * Math.cos(t)), Math.round(y + rad * Math.sin(t)));
              if (v) return v;
            }
          }
          return 0;
        }

        board.addEventListener("pointerdown", (e) => {
          if (!labels || e.button > 0) return;
          const rect = board.getBoundingClientRect();
          const border = 5;
          const inner = rect.width - border * 2;
          const x = Math.floor(((e.clientX - rect.left - border) / inner) * SIZE);
          const y = Math.floor(((e.clientY - rect.top - border) / inner) * SIZE);
          const region = regionAt(x, y);
          if (!region) return;
          const color = currentColor === "#ffffff" ? null : currentColor;
          if (fillRegion(region, color, x, y)) {
            bloop(260 + currentColorIndex * 22);
            sparkle(e.clientX, e.clientY, currentColor);
            updateButtons();
            checkFinished();
          }
        });

        function checkFinished() {
          if (celebrated) return;
          // Every sizable area except the biggest one (usually the background).
          let biggest = 1;
          for (let k = 1; k < regionSizes.length; k++) if (regionSizes[k] > regionSizes[biggest]) biggest = k;
          const minSize = 450;
          for (let k = 1; k < regionSizes.length; k++) {
            if (k === biggest || regionSizes[k] < minSize) continue;
            if (!fills[k]) return;
          }
          celebrated = true;
          setTimeout(celebrate, 350);
        }

        /* =========================================================
         * UI
         * ========================================================= */
        const bucketSvg = (hex, size) =>
          `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 40 40">` +
          `<g transform="rotate(-30 24 22)" stroke="#222" stroke-width="2.2" stroke-linejoin="round">` +
          `<path d="M14 14 Q24 -3 34 14" fill="none"/>` +
          `<path d="M12 14 H36 L33 34 Q24 37 15 34Z" fill="${hex}"/>` +
          `<path d="M16 22 H32" stroke="#fff" stroke-opacity="0.7" stroke-width="2" fill="none"/>` +
          `<ellipse cx="24" cy="14" rx="12" ry="4" fill="#fff"/></g>` +
          `<path d="M8 19 C3 25 2 32 4 36 C6 39 10 37 9.5 32 C9 27 11 23 13 20Z" fill="${hex}" stroke="#222" stroke-width="2"/>` +
          `</svg>`;

        function setColor(i) {
          currentColorIndex = i;
          currentColor = COLORS[i][0];
          document.querySelectorAll(".swatch").forEach((el, k) => {
            el.classList.toggle("selected", k === i);
            el.setAttribute("aria-checked", k === i ? "true" : "false");
          });
          const svg = bucketSvg(currentColor, 40);
          board.style.cursor = `url("data:image/svg+xml,${encodeURIComponent(svg)}") 4 37, crosshair`;
          document.getElementById("current").innerHTML = svg;
        }

        const palette = document.getElementById("palette");
        COLORS.forEach(([hex, name], i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "swatch";
          b.style.setProperty("--c", hex);
          b.title = name;
          b.setAttribute("role", "radio");
          b.setAttribute("aria-label", name);
          b.addEventListener("click", () => {
            setColor(i);
            tick(520 + i * 18);
          });
          palette.appendChild(b);
        });

        function updateButtons() {
          document.getElementById("undoBtn").disabled = history.length === 0;
        }

        // Shuffle bag so pictures don't repeat until all have been shown.
        let bag = [];
        function nextRandomPicture() {
          if (!bag.length) {
            bag = PICTURES.map((_, i) => i).filter((i) => i !== picIndex);
            for (let i = bag.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [bag[i], bag[j]] = [bag[j], bag[i]];
            }
          }
          return bag.pop();
        }

        document.getElementById("newBtn").addEventListener("click", () => {
          loadPicture(nextRandomPicture());
          tick(700);
        });

        document.getElementById("undoBtn").addEventListener("click", () => {
          finishAnim();
          const last = history.pop();
          if (!last) return;
          if (last.type === "clear") fills = last.prev;
          else if (last.prev) fills[last.region] = last.prev;
          else delete fills[last.region];
          repaintAll();
          updateButtons();
          tick(380);
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
          finishAnim();
          if (!Object.keys(fills).length) return;
          history.push({ type: "clear", prev: { ...fills } });
          fills = {};
          celebrated = false;
          repaintAll();
          updateButtons();
          tick(300);
        });

        document.getElementById("saveBtn").addEventListener("click", () => {
          finishAnim();
          const name = (PICTURES[picIndex]?.name || "picture").toLowerCase().replace(/\s+/g, "-");
          const a = document.createElement("a");
          a.download = `color-me-${name}.png`;
          a.href = board.toDataURL("image/png");
          document.body.appendChild(a);
          a.click();
          a.remove();
        });

        const soundBtn = document.getElementById("soundBtn");
        const renderSound = () => (soundBtn.textContent = muted ? "🔇" : "🔊");
        soundBtn.addEventListener("click", () => {
          muted = !muted;
          try {
            localStorage.setItem("colorMeMuted", muted ? "1" : "0");
          } catch (e) {}
          renderSound();
          tick(600);
        });
        renderSound();

        /* Gallery */
        const gallery = document.getElementById("gallery");
        const grid = document.getElementById("galleryGrid");
        PICTURES.forEach((pic, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "thumb";
          b.innerHTML = svgMarkup(pic, 100).replace(/ width="100" height="100"/, "") + `<div>${pic.name}</div>`;
          b.addEventListener("click", () => {
            closeGallery();
            if (i !== picIndex) loadPicture(i);
          });
          grid.appendChild(b);
        });
        const openGallery = () => {
          [...grid.children].forEach((el, i) => el.classList.toggle("current-pic", i === picIndex));
          gallery.classList.add("open");
          gallery.setAttribute("aria-hidden", "false");
        };
        const closeGallery = () => {
          gallery.classList.remove("open");
          gallery.setAttribute("aria-hidden", "true");
        };
        document.getElementById("pickBtn").addEventListener("click", openGallery);
        document.getElementById("closeGallery").addEventListener("click", closeGallery);
        gallery.addEventListener("click", (e) => {
          if (e.target === gallery) closeGallery();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeGallery();
        });

        /* Fit the square board into whatever space is left. */
        const wrap = document.getElementById("wrap");
        function fitBoard() {
          const cs = getComputedStyle(wrap);
          const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
          const s = Math.max(160, Math.floor(Math.min(w, h)));
          board.style.width = board.style.height = s + "px";
        }
        window.addEventListener("resize", fitBoard);

        /* =========================================================
         * Fun: sounds, sparkles, confetti
         * ========================================================= */
        let actx = null;
        function tone(freq, endFreq, dur, vol, type = "sine") {
          if (muted) return;
          try {
            actx = actx || new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            const t = actx.currentTime;
            const o = actx.createOscillator();
            const g = actx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            o.frequency.exponentialRampToValueAtTime(endFreq, t + dur * 0.6);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(actx.destination);
            o.start(t);
            o.stop(t + dur + 0.02);
          } catch (e) {}
        }
        const bloop = (f) => tone(f, f * 1.9, 0.25, 0.22);
        const tick = (f) => tone(f, f * 1.2, 0.08, 0.08, "triangle");

        function sparkle(x, y, color) {
          for (let i = 0; i < 9; i++) {
            const s = document.createElement("span");
            s.className = "spark";
            const a = (i / 9) * Math.PI * 2 + Math.random() * 0.5;
            const dist = 30 + Math.random() * 25;
            s.style.left = x + "px";
            s.style.top = y + "px";
            s.style.background = color === "#ffffff" ? "#ffe066" : color;
            s.style.setProperty("--dx", Math.cos(a) * dist + "px");
            s.style.setProperty("--dy", Math.sin(a) * dist + "px");
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 650);
          }
        }

        function celebrate() {
          const toast = document.getElementById("toast");
          const words = ["Beautiful! 🌟", "Amazing! 🎉", "So pretty! 🌈", "Great job! ⭐", "Wow! 💖"];
          toast.textContent = words[Math.floor(Math.random() * words.length)];
          toast.classList.remove("show");
          void toast.offsetWidth;
          toast.classList.add("show");
          [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.22, 0.15, "triangle"), i * 110));
          for (let i = 0; i < 70; i++) {
            const c = document.createElement("span");
            c.className = "confetti";
            c.style.left = Math.random() * 100 + "vw";
            c.style.background = COLORS[Math.floor(Math.random() * 21)][0];
            c.style.setProperty("--drift", (Math.random() - 0.5) * 200 + "px");
            c.style.setProperty("--spin", Math.random() * 900 + "deg");
            c.style.setProperty("--t", 2 + Math.random() * 1.5 + "s");
            c.style.animationDelay = Math.random() * 0.6 + "s";
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 4200);
          }
        }

        /* =========================================================
         * Start
         * ========================================================= */
        setColor(currentColorIndex);
        fitBoard();
        loadPicture(nextRandomPicture());
      })();
    </script>
  </body>
</html>
