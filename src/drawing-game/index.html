<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Drawing Pad</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; width: 100vw;
  }
  #toolbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: #2b2f36;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 10;
    position: relative;
    flex-wrap: wrap;
  }
  .tool {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #3a3f48;
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    color: #fff;
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
    padding: 0;
  }
  .tool:active { transform: scale(0.92); }
  .tool.active { border-color: #ffd34d; background: #4a5160; }
  .tool svg { width: 24px; height: 24px; pointer-events: none; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%;
    background: #000;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  #canvas-wrap {
    flex: 1 1 auto; position: relative; background: #fff;
    overflow: hidden;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
    background: #fff;
  }
  .popup {
    position: absolute;
    top: 100%;
    background: #2b2f36;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    z-index: 20;
    display: none;
    margin-top: 6px;
  }
  .popup.open { display: block; }
  #color-popup {
    display: none;
    grid-template-columns: repeat(6, 32px);
    gap: 8px;
    width: max-content;
  }
  #color-popup.open { display: grid; }
  .color-cell {
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    transition: transform 0.1s;
  }
  .color-cell:active { transform: scale(0.85); }
  .color-cell.selected {
    box-shadow: 0 0 0 3px #ffd34d;
  }
  #size-popup {
    display: none;
    flex-direction: row;
    gap: 12px;
    align-items: center;
  }
  #size-popup.open { display: flex; }
  .size-cell {
    width: 44px; height: 44px;
    background: #3a3f48;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .size-cell.selected { border-color: #ffd34d; }
  .size-dot { background: #fff; border-radius: 50%; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; padding: 22px;
    max-width: 320px; width: 80%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .modal h2 { margin: 0 0 10px; font-size: 18px; }
  .modal p { margin: 0 0 18px; color: #555; font-size: 14px; }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }
  .modal-buttons button {
    flex: 1; padding: 10px 16px; border-radius: 8px;
    border: none; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .btn-cancel { background: #e5e7eb; color: #333; }
  .btn-confirm { background: #ef4444; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button class="tool" id="color-btn" title="Color">
      <span class="color-swatch" id="color-swatch"></span>
    </button>
    <button class="tool" id="brush-btn" title="Brush size">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20l4-1 9.5-9.5a2.121 2.121 0 0 0-3-3L5 16l-1 4z"/>
        <path d="M14.5 6.5l3 3"/>
      </svg>
    </button>
    <button class="tool" id="eraser-btn" title="Eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17l6 6 12-12-6-6L3 17z"/>
        <path d="M9 23h12"/>
        <path d="M8 12l6 6"/>
      </svg>
    </button>
    <button class="tool" id="undo-btn" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"/>
        <path d="M21 4v6h-6"/>
      </svg>
    </button>
    <button class="tool" id="trash-btn" title="Clear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/>
        <path d="M14 11v6"/>
      </svg>
    </button>

    <div class="popup" id="color-popup"></div>
    <div class="popup" id="size-popup"></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h2>Start Over?</h2>
    <p>This will erase your entire drawing. Are you sure?</p>
    <div class="modal-buttons">
      <button class="btn-cancel" id="cancel-clear">Cancel</button>
      <button class="btn-confirm" id="confirm-clear">Start Over</button>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('canvas-wrap');
  const ctx = canvas.getContext('2d');

  // 24 colors evenly spanning the spectrum (hue) + black/white/grays mixed.
  // Use HSL evenly: 20 hues + black/dark-gray/light-gray/white = 24
  const colors = [];
  for (let i = 0; i < 20; i++) {
    const h = Math.round((360 * i) / 20);
    colors.push(`hsl(${h}, 85%, 50%)`);
  }
  colors.push('#000000', '#555555', '#aaaaaa', '#ffffff');

  const sizes = [3, 7, 14, 26];

  const state = {
    color: '#000000',
    size: sizes[1],
    eraser: false,
    drawing: false,
    lastX: 0,
    lastY: 0,
    strokes: [],   // array of stroke objects {color, size, eraser, points:[{x,y}]}
    current: null,
    dpr: window.devicePixelRatio || 1,
  };

  // ---- Canvas sizing ----
  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    state.dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * state.dpr);
    canvas.height = Math.round(rect.height * state.dpr);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    redraw();
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

  // ---- Drawing ----
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return {
      x: (clientX - rect.left) * state.dpr,
      y: (clientY - rect.top) * state.dpr,
    };
  }

  function startStroke(e) {
    e.preventDefault();
    closePopups();
    const p = getPos(e);
    state.drawing = true;
    state.current = {
      color: state.color,
      size: state.size,
      eraser: state.eraser,
      points: [p],
    };
    state.lastX = p.x;
    state.lastY = p.y;
    // Draw an initial dot
    drawSegment(state.current, p, p);
  }

  function moveStroke(e) {
    if (!state.drawing) return;
    e.preventDefault();
    const p = getPos(e);
    const last = state.current.points[state.current.points.length - 1];
    state.current.points.push(p);
    drawSegment(state.current, last, p);
  }

  function endStroke(e) {
    if (!state.drawing) return;
    if (e) e.preventDefault();
    state.drawing = false;
    if (state.current && state.current.points.length > 0) {
      state.strokes.push(state.current);
    }
    state.current = null;
  }

  function applyStrokeStyle(stroke) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = stroke.size * state.dpr;
    if (stroke.eraser) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = stroke.color;
    }
  }

  function drawSegment(stroke, a, b) {
    applyStrokeStyle(stroke);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawStroke(stroke) {
    if (stroke.points.length === 0) return;
    applyStrokeStyle(stroke);
    ctx.beginPath();
    const pts = stroke.points;
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) {
      ctx.lineTo(pts[0].x + 0.01, pts[0].y + 0.01);
    } else {
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
    }
    ctx.stroke();
  }

  function redraw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    for (const s of state.strokes) drawStroke(s);
  }

  // Pointer events (works for mouse + touch + pen on modern browsers)
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      startStroke(e);
    });
    canvas.addEventListener('pointermove', moveStroke);
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', (e) => { if (state.drawing) endStroke(e); });
  } else {
    canvas.addEventListener('mousedown', startStroke);
    canvas.addEventListener('mousemove', moveStroke);
    window.addEventListener('mouseup', endStroke);
    canvas.addEventListener('touchstart', startStroke, { passive: false });
    canvas.addEventListener('touchmove', moveStroke, { passive: false });
    canvas.addEventListener('touchend', endStroke, { passive: false });
    canvas.addEventListener('touchcancel', endStroke, { passive: false });
  }

  // ---- Toolbar UI ----
  const colorBtn = document.getElementById('color-btn');
  const colorSwatch = document.getElementById('color-swatch');
  const colorPopup = document.getElementById('color-popup');
  const brushBtn = document.getElementById('brush-btn');
  const sizePopup = document.getElementById('size-popup');
  const eraserBtn = document.getElementById('eraser-btn');
  const undoBtn = document.getElementById('undo-btn');
  const trashBtn = document.getElementById('trash-btn');

  // Build color popup
  colors.forEach((c) => {
    const cell = document.createElement('div');
    cell.className = 'color-cell';
    cell.style.background = c;
    cell.dataset.color = c;
    if (c === state.color) cell.classList.add('selected');
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      state.color = c;
      state.eraser = false;
      colorSwatch.style.background = c;
      eraserBtn.classList.remove('active');
      colorPopup.querySelectorAll('.color-cell').forEach(el => el.classList.remove('selected'));
      cell.classList.add('selected');
      closePopups();
    });
    colorPopup.appendChild(cell);
  });

  // Build size popup
  sizes.forEach((s) => {
    const cell = document.createElement('div');
    cell.className = 'size-cell';
    if (s === state.size) cell.classList.add('selected');
    const dot = document.createElement('div');
    dot.className = 'size-dot';
    dot.style.width = s + 'px';
    dot.style.height = s + 'px';
    cell.appendChild(dot);
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      state.size = s;
      sizePopup.querySelectorAll('.size-cell').forEach(el => el.classList.remove('selected'));
      cell.classList.add('selected');
      closePopups();
    });
    sizePopup.appendChild(cell);
  });

  function positionPopup(popup, btn) {
    const tbRect = document.getElementById('toolbar').getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    // First show to measure
    popup.style.left = '0px';
    popup.classList.add('open');
    const pRect = popup.getBoundingClientRect();
    let left = btnRect.left - tbRect.left + (btnRect.width / 2) - (pRect.width / 2);
    const maxLeft = tbRect.width - pRect.width - 8;
    if (left < 8) left = 8;
    if (left > maxLeft) left = maxLeft;
    popup.style.left = left + 'px';
  }

  function closePopups() {
    colorPopup.classList.remove('open');
    sizePopup.classList.remove('open');
  }

  colorBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = colorPopup.classList.contains('open');
    closePopups();
    if (!wasOpen) positionPopup(colorPopup, colorBtn);
  });

  brushBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = sizePopup.classList.contains('open');
    closePopups();
    if (!wasOpen) positionPopup(sizePopup, brushBtn);
  });

  eraserBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closePopups();
    state.eraser = !state.eraser;
    eraserBtn.classList.toggle('active', state.eraser);
  });

  undoBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closePopups();
    if (state.strokes.length > 0) {
      state.strokes.pop();
      redraw();
    }
  });

  // Trash / confirm modal
  const modal = document.getElementById('confirm-modal');
  trashBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closePopups();
    if (state.strokes.length === 0) return;
    modal.classList.add('open');
  });
  document.getElementById('cancel-clear').addEventListener('click', () => {
    modal.classList.remove('open');
  });
  document.getElementById('confirm-clear').addEventListener('click', () => {
    state.strokes = [];
    redraw();
    modal.classList.remove('open');
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('open');
  });

  // Close popups on outside click / canvas interaction
  document.addEventListener('click', () => closePopups());
  document.addEventListener('touchstart', (e) => {
    if (!e.target.closest('#toolbar')) closePopups();
  }, { passive: true });

  // Prevent iOS double-tap zoom and pull-to-refresh on canvas area
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // Init
  colorSwatch.style.background = state.color;
  resizeCanvas();
})();
</script>
</body>
</html>
