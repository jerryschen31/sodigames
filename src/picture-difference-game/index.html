<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Spot the 5 Differences</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #fef9e7 0%, #fcf3cf 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Comic Sans MS", sans-serif;
    color: #2c3e50;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    text-align: center;
    padding: 12px 16px 8px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: clamp(16px, 3.5vw, 26px);
    color: #2c3e50;
    line-height: 1.2;
  }
  header .subheader {
    font-size: clamp(12px, 2.4vw, 16px);
    color: #5d6d7e;
    margin-top: 4px;
  }
  .counter {
    display: inline-block;
    margin-top: 8px;
    background: #fff;
    border: 3px solid #f39c12;
    color: #d35400;
    font-weight: 800;
    font-size: clamp(16px, 3vw, 22px);
    padding: 4px 16px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .counter .found {
    color: #27ae60;
    font-size: 1.2em;
  }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 8px 8px;
  }
  .picture-frame {
    flex: 1;
    min-height: 0;
    background: white;
    border: 3px solid #34495e;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }
  .picture-frame.modified {
    border-color: #2980b9;
    cursor: crosshair;
  }
  .picture-label {
    position: absolute;
    top: 6px;
    left: 8px;
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: clamp(10px, 2vw, 13px);
    font-weight: 600;
    z-index: 2;
    pointer-events: none;
  }
  .picture-frame svg {
    display: block;
    /* Explicit width/height are set in JS (scene dimensions).
       CSS then scales them down to fit while preserving aspect ratio. */
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
  }
  .found-marker {
    fill: none;
    stroke: #27ae60;
    stroke-width: 5;
    animation: pop 0.4s ease-out;
    pointer-events: none;
  }
  .miss-marker {
    fill: none;
    stroke: #e74c3c;
    stroke-width: 3;
    animation: missfade 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes pop {
    0% { stroke-width: 0; opacity: 0; transform-origin: center; }
    60% { stroke-width: 8; opacity: 1; }
    100% { stroke-width: 5; opacity: 1; }
  }
  @keyframes missfade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  #celebration {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    text-align: center;
    padding: 24px;
    backdrop-filter: blur(4px);
    z-index: 10;
    transition: opacity 0.2s;
  }
  #celebration.hidden { opacity: 0; pointer-events: none; }
  #celebration h2 {
    font-size: clamp(28px, 7vw, 56px);
    color: #ffd93d;
    text-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  #celebration p { font-size: clamp(16px, 3vw, 22px); margin-top: 12px; opacity: 0.9; }
  .confetti {
    position: absolute;
    width: 10px; height: 14px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .home-button {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    z-index: 24;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 6px 13px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    color: #2c3e50;
    background: linear-gradient(180deg, #fff6a6, #ffd93d);
    box-shadow: 0 4px 0 #c58f11, 0 8px 12px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  .home-button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #c58f11, 0 6px 10px rgba(0,0,0,0.2);
  }

  .exit-modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.48);
    backdrop-filter: blur(3px);
  }

  .exit-modal.open { display: flex; }

  .exit-dialog {
    width: min(360px, 92vw);
    border-radius: 14px;
    border: 4px solid #fff;
    padding: 22px;
    background: linear-gradient(180deg, #fff9db, #ffe7a8);
    text-align: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.34);
  }

  .exit-dialog h2 {
    margin: 0;
    color: #2c3e50;
    font-size: clamp(24px, 5vw, 30px);
    line-height: 1.15;
  }

  .exit-actions {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .exit-actions button {
    min-width: 94px;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 8px 14px;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }

  .exit-yes { background: linear-gradient(180deg, #ff6b9d, #c2185b); }
  .exit-no { background: linear-gradient(180deg, #4ecdc4, #00897b); }

  /* Landscape on short screens: keep pictures stacked but tighten header */
  @media (orientation: landscape) and (max-height: 600px) {
    header { padding: 4px 12px 2px; }
    header h1 { font-size: 14px; }
    header .subheader { font-size: 11px; margin-top: 2px; }
    .counter { margin-top: 4px; padding: 2px 12px; font-size: 14px; }
    main { gap: 6px; padding: 2px 6px 6px; }
  }
</style>
</head>
<body>
  <button type="button" class="home-button" id="home-button" aria-label="Exit game">Home</button>

  <div class="exit-modal" id="exit-modal" role="dialog" aria-modal="true" aria-labelledby="exit-title">
    <div class="exit-dialog">
      <h2 id="exit-title">Exit Game. Are you sure?</h2>
      <div class="exit-actions">
        <button type="button" class="exit-yes" id="exit-yes">Yes</button>
        <button type="button" class="exit-no" id="exit-no">No</button>
      </div>
    </div>
  </div>

  <header>
    <h1>Can you spot the 5 differences between the two pictures?</h1>
    <div class="subheader">Click on the differences in the bottom picture</div>
    <div class="counter"><span class="found" id="found-count">0</span> / 5</div>
  </header>
  <main>
    <div class="picture-frame reference">
      <div class="picture-label">Top picture (reference)</div>
      <div id="ref-container" style="display:contents;"></div>
    </div>
    <div class="picture-frame modified">
      <div class="picture-label">Bottom picture — tap the differences ↓</div>
      <div id="mod-container" style="display:contents;"></div>
    </div>
  </main>
  <div id="celebration" class="hidden">
    <h2 id="celebration-title">Great job! 🎉</h2>
    <p>You found all 5! Next picture coming up…</p>
  </div>

(() => {
  const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  // Tap forgiveness, expressed in SVG units. Scenes use viewBox 800x500, so 18 units
  // is roughly a fingertip's worth of slack on a typical phone.
  const TAP_PAD = IS_TOUCH ? 18 : 0;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const foundCountEl = document.getElementById('found-count');
  const refContainer = document.getElementById('ref-container');
  const modContainer = document.getElementById('mod-container');
  const celebration = document.getElementById('celebration');

  let allScenes = [];
  let queue = [];
  let currentScene = null;
  let foundCount = 0;
  let locked = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeSvgEl(type, attrs = {}) {
    const el = document.createElementNS(SVG_NS, type);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null) continue;
      el.setAttribute(k, v);
    }
    return el;
  }

  function elementFromSpec(spec) {
    const attrs = {};
    for (const [k, v] of Object.entries(spec)) {
      if (k === 'type' || k === 'id' || k === 'text') continue;
      attrs[k] = v;
    }
    const node = makeSvgEl(spec.type, attrs);
    if (spec.type === 'text' && spec.text !== undefined) {
      node.textContent = spec.text;
    }
    return node;
  }

  function applyDifferences(elements, differences) {
    let out = elements.map(e => ({ ...e }));
    for (const diff of differences) {
      if (diff.remove) {
        out = out.filter(e => e.id !== diff.remove);
      }
      if (diff.modify) {
        const idx = out.findIndex(e => e.id === diff.modify.id);
        if (idx >= 0) out[idx] = { ...out[idx], ...diff.modify };
      }
      if (diff.add) {
        out.push({ ...diff.add });
      }
    }
    return out;
  }

  function buildSvg(scene, applyDiffs) {
    const svg = makeSvgEl('svg', {
      viewBox: `0 0 ${scene.width} ${scene.height}`,
      preserveAspectRatio: 'xMidYMid meet',
      // Explicit intrinsic dimensions are required on mobile Safari —
      // without them the SVG collapses to 0×0 and renders blank.
      width: scene.width,
      height: scene.height,
    });
    const elements = applyDiffs
      ? applyDifferences(scene.elements, scene.differences)
      : scene.elements;
    for (const el of elements) {
      svg.appendChild(elementFromSpec(el));
    }
    return svg;
  }

  function loadScene(scene) {
    currentScene = JSON.parse(JSON.stringify(scene));
    currentScene.differences.forEach(d => d.found = false);
    foundCount = 0;
    locked = false;
    updateCounter();

    refContainer.innerHTML = '';
    refContainer.appendChild(buildSvg(currentScene, false));

    modContainer.innerHTML = '';
    const modSvg = buildSvg(currentScene, true);
    modSvg.id = 'modified-svg';
    modSvg.addEventListener('pointerdown', onTap);
    modContainer.appendChild(modSvg);
  }

  function nextScene() {
    if (queue.length === 0) {
      queue = shuffle(allScenes.map((_, i) => i));
    }
    const idx = queue.shift();
    loadScene(allScenes[idx]);
  }

  function updateCounter() {
    foundCountEl.textContent = foundCount;
  }

  function svgPointFromEvent(svg, ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return pt.matrixTransform(ctm.inverse());
  }

  function onTap(ev) {
    if (locked || !currentScene) return;
    if (ev.cancelable) ev.preventDefault();
    const svg = ev.currentTarget;
    const p = svgPointFromEvent(svg, ev);
    if (!p) return;

    let best = null;
    let bestDist = Infinity;
    for (const diff of currentScene.differences) {
      if (diff.found) continue;
      const dx = p.x - diff.hitZone.cx;
      const dy = p.y - diff.hitZone.cy;
      const d = Math.hypot(dx, dy);
      if (d <= diff.hitZone.r + TAP_PAD && d < bestDist) {
        best = diff;
        bestDist = d;
      }
    }
    if (best) {
      markFound(best, svg);
    } else {
      showMiss(svg, p.x, p.y);
    }
  }

  function markFound(diff, svg) {
    diff.found = true;
    foundCount++;
    updateCounter();
    const circle = makeSvgEl('circle', {
      cx: diff.hitZone.cx,
      cy: diff.hitZone.cy,
      r: diff.hitZone.r,
      class: 'found-marker',
    });
    svg.appendChild(circle);
    if (foundCount === currentScene.differences.length) {
      locked = true;
      setTimeout(celebrate, 700);
    }
  }

  function showMiss(svg, x, y) {
    const circle = makeSvgEl('circle', {
      cx: x, cy: y, r: 14, class: 'miss-marker',
    });
    svg.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  }

  function spawnConfetti() {
    const colors = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff', '#c780fa', '#ff9f43'];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      c.style.transform = `rotate(${Math.random() * 360}deg)`;
      frag.appendChild(c);
    }
    celebration.appendChild(frag);
    setTimeout(() => {
      celebration.querySelectorAll('.confetti').forEach(n => n.remove());
    }, 3500);
  }

  function celebrate() {
    celebration.classList.remove('hidden');
    spawnConfetti();
    setTimeout(() => {
      celebration.classList.add('hidden');
      nextScene();
    }, 2200);
  }

  function start() {
    allScenes = SCENES;
    nextScene();
  }

  start();
})();
</script>
  <script>
  (() => {
    const homeButton = document.getElementById('home-button');
    const exitModal = document.getElementById('exit-modal');
    const exitYes = document.getElementById('exit-yes');
    const exitNo = document.getElementById('exit-no');

    homeButton.addEventListener('click', () => exitModal.classList.add('open'));
    exitNo.addEventListener('click', () => exitModal.classList.remove('open'));
    exitYes.addEventListener('click', () => {
      window.location.href = 'https://sodigames.com';
    });

    exitModal.addEventListener('click', (event) => {
      if (event.target === exitModal) exitModal.classList.remove('open');
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && exitModal.classList.contains('open')) {
        exitModal.classList.remove('open');
      }
    });
  })();
  </script>
