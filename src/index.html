<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoDi - Games for Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+2:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff5fa2;
        --yellow: #ffd93d;
        --blue: #4ec5ff;
        --green: #6bd968;
        --purple: #b06bff;
        --orange: #ff9450;
        --ink: #2b2350;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        font-family: "Fredoka", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 18%, #ffe066 0 8px, transparent 9px),
          radial-gradient(circle at 82% 12%, #ff8fb1 0 6px, transparent 7px),
          radial-gradient(circle at 22% 78%, #8fd6ff 0 10px, transparent 11px),
          radial-gradient(circle at 75% 70%, #b8f0a1 0 7px, transparent 8px),
          radial-gradient(circle at 50% 40%, #ffd0a8 0 5px, transparent 6px),
          linear-gradient(135deg, #fff2c7 0%, #ffd8ec 40%, #c7ecff 100%);
        background-attachment: fixed;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
      }

      body::before {
        width: 220px;
        height: 140px;
        background: #fff;
        top: 8%;
        left: -40px;
        box-shadow:
          80px 30px 0 -10px #fff,
          160px -10px 0 -20px #fff;
        animation: drift 30s linear infinite;
      }

      body::after {
        width: 180px;
        height: 110px;
        background: #fff;
        top: 55%;
        right: -60px;
        box-shadow:
          -70px 40px 0 -10px #fff,
          -130px 10px 0 -20px #fff;
        animation: drift 42s linear infinite reverse;
      }

      @keyframes drift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(40px);
        }
      }

      header {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 56px 20px 24px;
      }

      .support-btn {
        position: absolute;
        top: 14px;
        right: 18px;
        text-decoration: none;
        color: var(--ink);
        font-family: "Baloo 2", "Fredoka", sans-serif;
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 0.4px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 3px solid #fff;
        background: linear-gradient(180deg, #ffe58f, #ffb256);
        box-shadow:
          0 4px 0 #c6761f,
          0 8px 16px rgba(43, 35, 80, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .support-btn:hover,
      .support-btn:focus-visible {
        transform: translateY(-2px) scale(1.03);
        box-shadow:
          0 6px 0 #c6761f,
          0 12px 20px rgba(43, 35, 80, 0.3);
        outline: none;
      }

      .support-btn:active {
        transform: translateY(1px) scale(0.99);
        box-shadow:
          0 3px 0 #c6761f,
          0 6px 12px rgba(43, 35, 80, 0.24);
      }

      @media (max-width: 700px) {
        .support-btn {
          top: 10px;
          right: 12px;
          font-size: 0.9rem;
          padding: 8px 14px;
        }
      }

      header h1 {
        font-family: "Baloo 2", "Fredoka", sans-serif;
        font-weight: 800;
        font-size: clamp(2.2rem, 6vw, 4rem);
        margin: 0;
        color: #fff;
        text-shadow:
          0 4px 0 var(--pink),
          0 8px 0 rgba(43, 35, 80, 0.25),
          0 14px 24px rgba(43, 35, 80, 0.2);
        letter-spacing: 1px;
        transform: rotate(-1.5deg);
        display: inline-block;
      }

      header p {
        margin: 14px auto 0;
        max-width: 540px;
        font-size: 1.1rem;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.7);
        padding: 8px 18px;
        border-radius: 999px;
        display: inline-block;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 24px 80px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 28px;
      }

      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #fff;
        border-radius: 24px;
        padding: 18px 18px 22px;
        box-shadow:
          0 6px 0 rgba(43, 35, 80, 0.12),
          0 18px 30px -10px rgba(43, 35, 80, 0.25);
        transform: translateY(0) rotate(var(--tilt, 0deg));
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          background 0.25s ease;
        border: 4px solid transparent;
        cursor: pointer;
        outline: none;
      }

      .card:nth-child(4n + 1) {
        --tilt: -1.2deg;
        --accent: var(--pink);
      }
      .card:nth-child(4n + 2) {
        --tilt: 1.2deg;
        --accent: var(--blue);
      }
      .card:nth-child(4n + 3) {
        --tilt: -0.6deg;
        --accent: var(--green);
      }
      .card:nth-child(4n + 4) {
        --tilt: 0.8deg;
        --accent: var(--purple);
      }

      .card:hover,
      .card:focus-visible {
        transform: translateY(-8px) rotate(0deg) scale(1.03);
        box-shadow:
          0 10px 0 var(--accent),
          0 28px 40px -10px rgba(43, 35, 80, 0.35);
        background: #fffef7;
        border-color: var(--accent);
      }

      .card:active {
        transform: translateY(-2px) scale(0.99);
      }

      .thumb {
        background: linear-gradient(
          135deg,
          var(--thumb-a, #ffe7a8),
          var(--thumb-b, #ffb3d2)
        );
        border-radius: 16px;
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      .card:nth-child(4n + 1) .thumb {
        --thumb-a: #ffd1e3;
        --thumb-b: #ffb0c8;
      }
      .card:nth-child(4n + 2) .thumb {
        --thumb-a: #c7e9ff;
        --thumb-b: #8ed1ff;
      }
      .card:nth-child(4n + 3) .thumb {
        --thumb-a: #d6f5cf;
        --thumb-b: #a8e29c;
      }
      .card:nth-child(4n + 4) .thumb {
        --thumb-a: #e6d6ff;
        --thumb-b: #c4a6ff;
      }

      .thumb svg {
        width: 78%;
        height: 78%;
        filter: drop-shadow(0 4px 6px rgba(43, 35, 80, 0.15));
        transition: transform 0.3s ease;
      }

      .card:hover .thumb svg {
        transform: scale(1.08) rotate(-3deg);
      }

      .title {
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 1.35rem;
        margin: 14px 6px 4px;
        text-align: center;
      }

      .play {
        text-align: center;
        font-size: 0.95rem;
        color: var(--accent, var(--pink));
        font-weight: 600;
      }

      .play::after {
        content: " ▶";
      }

      footer {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 0 20px 30px;
        color: var(--ink);
        opacity: 0.7;
        font-size: 0.9rem;
      }
    </style>
  </head>
